<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>Blueprint registrations | The POD</title>
<link rel="icon" type="image/png" href="/brand/favicon.png">
<link rel="stylesheet" href="/garden.css">
<style>
.wrap{width:min(1100px,100%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stats b{font-variant-numeric:lining-nums;display:block;font-family:var(--serif-display);font-size:30px;color:var(--ink)}
.stats span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text)}
.ok{color:#2f6b3a;font-weight:600}.res{color:#7a5c2a;font-weight:600}.no{color:var(--muted)}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="/blueprint"><img src="/brand/logo-horizontal.png" alt="The POD"></a><div class="context">Blueprint registrations</div></header>
<main class="wrap">
  <form id="login" class="card" style="max-width:420px;margin:30px auto">
    <label class="f" for="key">Admin key</label>
    <input id="key" type="password" autocomplete="current-password">
    <button class="btn" type="submit">Open</button>
    <div class="msg error" id="msg"></div>
  </form>
  <section id="view" class="hidden">
    <div class="stats" id="stats"></div>
    <div class="row" style="margin:0 0 14px"><button class="btn" id="csv">Download CSV</button><button class="btn ghost" id="refresh">Refresh</button></div>
    <div class="tbl"><table><thead><tr><th>Status</th><th>Name</th><th>Format</th><th>Amount</th><th>WhatsApp</th><th>Email</th><th>Organisation</th><th>Role</th><th>Heard via</th><th>Registered</th><th>Reference</th></tr></thead><tbody id="rows"></tbody></table></div>
    <p class="small" style="margin-top:10px">"Reserved" = seat held without card payment (confirm their transfer, then treat as paid). "Started" = opened Paystack but did not finish: worth a friendly follow-up call.</p>
  </section>
</main>
<script>
(function(){
  var key = ""; try { key = sessionStorage.getItem("bpk") || ""; } catch(e){}
  var $ = function(id){ return document.getElementById(id); };
  var naira = function(n){ return "₦" + Number(n).toLocaleString("en-NG"); };
  var esc = function(s){ var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; };
  function load(){
    fetch("/api/blueprint/admin", { headers: { Authorization: "Bearer " + key } }).then(function(r){ return r.json(); }).then(function(r){
      if (!r.success) { $("msg").textContent = r.error || "Could not open."; $("login").classList.remove("hidden"); $("view").classList.add("hidden"); return; }
      try { sessionStorage.setItem("bpk", key); } catch(e){}
      $("login").classList.add("hidden"); $("view").classList.remove("hidden");
      var s = r.summary;
      $("stats").innerHTML = [["Paid seats", s.paid], ["Onsite", s.onsite + " / 50"], ["Virtual", s.virtual], ["Reserved", s.reserved], ["Revenue", naira(s.revenue)]]
        .map(function(x){ return "<div><b>" + esc(x[1]) + "</b><span>" + esc(x[0]) + "</span></div>"; }).join("");
      var label = { success: ["Paid", "ok"], reserved: ["Reserved", "res"], initialized: ["Started", "no"], failed: ["Failed", "no"] };
      $("rows").innerHTML = r.rows.map(function(x){
        var l = label[x.status] || [x.status, "no"];
        return "<tr><td class='" + l[1] + "'>" + l[0] + "</td><td>" + esc(x.name) + "</td><td>" + esc(x.format) + "</td><td>" + naira(x.amount) +
          "</td><td><a href='https://wa.me/" + esc(String(x.phone).replace(/\D/g, "").replace(/^0/, "234")) + "' target='_blank' rel='noopener'>" + esc(x.phone) + "</a></td><td>" + esc(x.email) +
          "</td><td>" + esc(x.organisation) + "</td><td>" + esc(x.role) + "</td><td>" + esc(x.heard) + "</td><td>" + esc((x.created_at || "").slice(0, 16).replace("T", " ")) + "</td><td>" + esc(x.reference) + "</td></tr>";
      }).join("");
    });
  }
  $("login").addEventListener("submit", function(e){ e.preventDefault(); key = $("key").value.trim(); load(); });
  $("refresh").addEventListener("click", load);
  $("csv").addEventListener("click", function(){
    fetch("/api/blueprint/admin?format=csv", { headers: { Authorization: "Bearer " + key } }).then(function(r){ return r.blob(); }).then(function(b){
      var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "blueprint-2027-registrations.csv"; a.click();
    });
  });
  if (key) load();
})();
</script>
</body>
</html>
